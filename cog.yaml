build:
  gpu: true
  cuda: "12.1"
  python_version: "3.11"
  system_packages:
    - "curl"
  python_packages:
    - "numpy<2"
    - "torch==2.4.0"
    - "torchvision==0.19.0"
    - "pillow==10.2.0"
    - "timm==0.9.12"
  run:
    - "mkdir -p /src/checkpoints"
    - "curl -f --retry 3 -o /src/checkpoints/model.pth https://static.peelapi.com/models/dinov3_vitl16_pretrain_lvd1689m-8aa4cbdd.pth"
predict: "predict.py:Predictor"
